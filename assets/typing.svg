<svg width="100%" viewBox="0 0 560 40" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Animated typing text cycling through: Digital Marketer. Bridging AI and Business. Boring ideas just need better branding.">

  <defs>
    <clipPath id="clip1">
      <rect x="0" y="0" width="0" height="40">
        <animate id="grow1" attributeName="width" from="0" to="205" dur="1.1s"
                 begin="0s;grow3.end+1.6s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="clip2">
      <rect x="0" y="0" width="0" height="40">
        <animate id="grow2" attributeName="width" from="0" to="272" dur="1.1s"
                 begin="grow1.end+1.6s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="clip3">
      <rect x="0" y="0" width="0" height="40">
        <animate id="grow3" attributeName="width" from="0" to="454" dur="1.1s"
                 begin="grow2.end+1.6s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#clip1)" opacity="1">
    <animate attributeName="opacity" to="0" dur="0.01s" begin="grow1.end+1.6s" fill="freeze"/>
    <animate attributeName="opacity" to="1" dur="0.01s" begin="0s;grow3.end+1.6s" fill="freeze"/>
    <text x="0" y="26" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="18" fill="#1B1B1B">
      <tspan fill="#00D9A3">&gt;</tspan> Digital Marketer
    </text>
  </g>

  <g clip-path="url(#clip2)" opacity="0">
    <animate attributeName="opacity" to="0" dur="0.01s" begin="grow2.end+1.6s" fill="freeze"/>
    <animate attributeName="opacity" to="1" dur="0.01s" begin="grow1.end+1.6s" fill="freeze"/>
    <text x="0" y="26" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="18" fill="#1B1B1B">
      <tspan fill="#00D9A3">&gt;</tspan> Bridging AI &amp; Business
    </text>
  </g>

  <g clip-path="url(#clip3)" opacity="0">
    <animate attributeName="opacity" to="0" dur="0.01s" begin="grow3.end+1.6s" fill="freeze"/>
    <animate attributeName="opacity" to="1" dur="0.01s" begin="grow2.end+1.6s" fill="freeze"/>
    <text x="0" y="26" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="18" fill="#1B1B1B">
      <tspan fill="#00D9A3">&gt;</tspan> Boring ideas just need better branding.
    </text>
  </g>

  <rect x="465" y="8" width="10" height="20" fill="#00D9A3">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
