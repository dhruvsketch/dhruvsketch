name: Generate contribution snake

# Regenerates the animated snake SVG from your real contribution graph.
# Runs daily and on every push to main. Needs Actions enabled to run,
# and needs an "output" branch to exist (created automatically on first run).
on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: dhruvsketch
          outputs: |
            assets/snake.svg
            assets/snake-dark.svg?palette=github-dark

      - name: Push snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: main
          build_dir: assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
